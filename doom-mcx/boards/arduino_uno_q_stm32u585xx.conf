#
# DOOM on the Arduino UNO Q (STM32U585: Cortex-M33 @160MHz, 768KB SRAM, 2MB
# internal flash, NO external flash). The WAD must live in the same 2MB as the
# engine, so we do NOT use a custom external-flash linker script (unlike the
# FRDM-MCXN947 board which puts the WAD in a separate 4MB QSPI region).

CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y

# DOOM only needs a few POSIX libc functions (free/printf/stat/write), NOT the
# realtime AEP (timers/signals). The full CONFIG_POSIX_API profile pulls in
# subsys/.../posix/options/timer.c, which references sigev_notify_function /
# sigev_notify_attributes that picolibc's struct sigevent lacks on Zephyr 4.4
# -> build break. Enable only the POSIX libc extension and the file-system /
# device-io options the engine uses; keep timers/signals OFF.
CONFIG_POSIX_C_LIB_EXT=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_POSIX_FILE_SYSTEM=y
# CONFIG_POSIX_API is not set
# CONFIG_POSIX_TIMERS is not set
# CONFIG_POSIX_SIGNALS is not set
# CONFIG_POSIX_CLOCK_SELECTION is not set

CONFIG_HEAP_MEM_POOL_SIZE=1024
# DOOM's D_DoomMain/D_DoomLoop run on the Zephyr MAIN thread. The renderer
# recurses (R_RenderBSPNode) and level setup uses large stack locals; 8KB
# overflows. With HW stack protection off, an overflow silently corrupts other
# RAM -> wild reads past SRAM (bus fault, BFAR beyond 0x200C0000) during level
# load. We have 768KB, so give main a generous 32KB. Also enable stack
# protection so any remaining overflow faults cleanly instead of corrupting.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y

# Trig/recip tables baked at build time into flash RODATA, not RAM (NXP talk).
CONFIG_DOOM_FIXED_RECIPROCAL_LUT=n
CONFIG_DOOM_CALC_TAN_TABLE=y
CONFIG_DOOM_CALC_SIN_TABLE=y

# Zone 194KB. Keep X_RES=400 (SCREENWIDTH = X_RES/2 = 200): this is the proven
# width. A previous 160x128 attempt (SCREENWIDTH=80) crashed at level load on
# small-SCREENWIDTH renderer assumptions, so we do NOT shrink the width.
CONFIG_DOOM_ZONE_HEAP_SIZE=194
CONFIG_DOOM_NO_WIPE=y

# Charlieplex matrix is 13 wide x 8 tall = landscape 1.625:1. The old Y_RES=320
# made the rendered frame 200x320 -- a PORTRAIT viewport (wrong FOV for DOOM,
# which is landscape) that then got crushed into the landscape matrix (vertical
# squashed ~40:1 vs horizontal ~15:1), making the image unreadable. Drop Y_RES
# to 128 so SCREENHEIGHT=128: the frame is now landscape 200x128 (~1.56:1, close
# to the matrix's 1.625:1), giving DOOM its natural wide view and a near-square
# per-cell average (~15x16 source px). Width stays 200 (the safe value). Also
# frees ~75KB of FAST_DATA_RAM (smaller backbuffer).
CONFIG_DOOM_X_RES=400
CONFIG_DOOM_Y_RES=128
CONFIG_DOOM_RGB565=y

# Downscale the rendered frame to the 13x8 charlieplex matrix (grayscale),
# writing brightness straight into the driver framebuffer.
CONFIG_DOOM_CHARLIEPLEX=y

# Controller input over the on-board SoC<->STM32 SPI link (SPI3 slave + RDY on
# PG13), reusing the charlieplex bridge block protocol. A host script sends
# WASD + fire as key-state blocks. SPI3 must run interrupt-driven (DMA mode is
# not wired for the slave); 2 MHz is the measured safe slave clock.
CONFIG_DOOM_SPI_INPUT=y
CONFIG_SPI_STM32_INTERRUPT=y
CONFIG_PINCTRL=y

# No NXP-specific peripherals on this board.
# CONFIG_DOOM_ZEPHYR_ADC_JOYSTICK is not set
# CONFIG_DOOM_ZEPHYR_TOUCH_SCREEN is not set
CONFIG_DOOM_ZEPHYR_BACKGROUND=y
# CONFIG_DOOM_SHOW_NXP_LOGO is not set

CONFIG_FLASH=y
CONFIG_DISPLAY=y
CONFIG_FPU=y

CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_BUILD_OUTPUT_HEX=y
