# Secure boot for the UNO Q STM32U585 via MCUboot (software root of trust).
#
# Build with sysbuild so the bootloader and the signed application image are
# produced together:
#
#   west build -p always --sysbuild -b arduino_uno_q \
#       samples/drivers/charlieplex_bridge
#
# Output:
#   build/mcuboot/zephyr/zephyr.bin                    -> flash at 0x08000000
#   build/charlieplex_bridge/zephyr/zephyr.signed.bin  -> flash at 0x08010000 (slot0)
#
# MCUboot validates the ECDSA-P256 signature of the slot0 image before booting
# it; an unsigned or tampered image is rejected. The board's flash partition map
# (mcuboot / image-0 / image-1 / storage) is already defined upstream.
#
# This uses the MCUboot *sample* signing key (root-ec-p256.pem) for the demo --
# replace with a private project key for any real deployment.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
