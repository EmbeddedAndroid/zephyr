CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_STM32_INTERRUPT=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y

CONFIG_DISPLAY=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# OTA / DFU: receive a signed image over SPI into slot1 and ask MCUboot to
# swap it in. Same config as charlieplex_bridge so this app can be updated UP
# to the bridge firmware. STM32U5 is explicit-erase -> STREAM_FLASH_ERASE.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_REBOOT=y
