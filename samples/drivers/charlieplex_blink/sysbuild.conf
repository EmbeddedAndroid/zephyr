# Same MCUboot secure-boot config as charlieplex_bridge: build the bootloader
# and an ECDSA-P256-signed app image together so this is a valid A/B OTA target
# (MCUboot sample key root-ec-p256.pem; replace for any real deployment).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
