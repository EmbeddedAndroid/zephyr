sample:
  name: SAIL BMC
  description: Mock board management controller on the Qualcomm SAIL UART
tests:
  sample.boards.qcom.sail.bmc:
    build_only: true
    platform_allow:
      - lemans_evk_sail/sail_lemans
    integration_platforms:
      - lemans_evk_sail/sail_lemans
    tags:
      - shell
      - soc
  sample.boards.qcom.sail.bmc.auto:
    build_only: true
    extra_args: SNIPPET=qcom-sail-iq9075-evk
    platform_allow:
      - ventuno_q_sail/sail_monaco/smp
    integration_platforms:
      - ventuno_q_sail/sail_monaco/smp
    tags:
      - shell
      - soc
