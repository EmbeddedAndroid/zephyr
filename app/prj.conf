# ZEPHYR-SAIL stub app config
# SPDX-License-Identifier: Apache-2.0

CONFIG_GPIO=n
CONFIG_SERIAL=n

# No Qualcomm GENI UART driver exists in Zephyr, so route printk() to a
# RAM console buffer (readable over JTAG at the symbol `ram_console`).
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_PRINTK=y

CONFIG_MULTITHREADING=y
CONFIG_BOOT_BANNER=y
CONFIG_THREAD_NAME=n

# The stub only does a handshake then idles forever; it needs no system
# tick. Run without a kernel timer to avoid pulling in a GIC/arch-timer
# bring-up we do not need.
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_TIMESLICING=n
CONFIG_IRQ_OFFLOAD=n
