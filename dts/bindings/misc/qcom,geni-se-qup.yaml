description: |
  Qualcomm QUP wrapper holding GENI serial engines. The reg property is the
  wrapper common register block; the clocks are the wrapper clocks that
  every serial engine needs.

compatible: "qcom,geni-se-qup"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    required: true
