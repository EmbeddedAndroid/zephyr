# Arduino UNO Q SWD over QCM2290 linuxgpiod (pins per ABX00162 schematic)
adapter driver linuxgpiod
adapter gpio swclk -chip 1 26
adapter gpio swdio -chip 1 25
adapter gpio srst  -chip 1 38
adapter speed 1000
transport select swd

# Use SRST only on user reset, NOT during connect, otherwise the chip
# stays held in reset and halt times out.
reset_config srst_only srst_nogate srst_push_pull

source [find target/stm32u5x.cfg]
