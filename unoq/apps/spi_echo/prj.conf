# SPI-slave echo bring-up for the UNO Q STM32U585.
# De-risks STM32U5 SPI-slave mode before layering the CAN bridge on top.

CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_STM32_INTERRUPT=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# Console + log on the board's default console UART (usart1) so we can watch
# transfers print. (Shell can be layered later; keep this app minimal first.)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

# Stack headroom for the SPI thread.
CONFIG_MAIN_STACK_SIZE=2048
