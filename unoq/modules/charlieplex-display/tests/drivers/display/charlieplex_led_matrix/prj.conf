CONFIG_ZTEST=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_COUNTER=y
CONFIG_COUNTER_NATIVE_SIM=y
CONFIG_DISPLAY=y
CONFIG_CHARLIEPLEX_LED_MATRIX=y
